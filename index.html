<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coca-Cola</title>

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/movile.css">
    <script type="module" src="script/main.js" defer></script>
</head>

<body data-brand="coca-cola">
    <!-- Header / Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="navbar-logo" aria-label="Coca-Cola">
                <img src="./images/header-logo.png" alt="Coca-Cola Logo" class="navbar-logo-img">
            </a>
            <ul class="navbar-links">
                <li><a href="#">ORIGINAL</a></li>
                <li><a href="#">ZERO</a></li>
                <li><a href="#">LIGHT</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="container" data-brand="coca-cola">
        <section class="main-content">
            <div class="title-img">
                <img class="title-img-logo" src="./images/logo-coke.webp" alt="Logo Coca-Cola">
                <img class="title-img-type" src="./images/logo-classic.png" alt="Logo variante">
            </div>
            <p class="main-content-copy">
                El sabor original que definió las gaseosas. Caramelo, burbujas y ese rojo inconfundible en una lata
                lista para refrescar.
            </p>
        </section>

        <section class="side-content">
            <img class="side-content-image" src="./images/coke-original.webp" alt="Lata de Coca-Cola">
            <div></div>
        </section>

        <section class="footer">
            <div id="boton1">
                <img src="./images/coke-original.webp" alt="Lata Coca-Cola Original">
            </div>

            <div id="boton2">
                <img src="./images/coke-zero.webp" alt="Lata Coca-Cola Zero">
            </div>

            <div id="boton3">
                <img src="./images/coke-light.webp" alt="Lata Coca-Cola Light">
            </div>
        </section>
    </section>

    <!-- Loader -->
    <section class="loader">
        <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module">
        </script>

        <dotlottie-player src="./animations/98e722d9-3f68-496a-b44b-55f23e4e8098.json" background="transparent"
            speed="1" style="width: 400px; height: 400px;" autoplay>
        </dotlottie-player>
    </section>

    <!-- Modal -->
    <section class="modal hidden" id="modal1">
        <div class="modal__content" >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="modal__content-close icon icon-tabler icons-tabler-outline icon-tabler-x">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M18 6l-12 12" />
                <path d="M6 6l12 12" />
            </svg>

            <div class="modal__content--slider">
                <input type="radio" name="slider-1" id="m1-radio-1" checked>
                <input type="radio" name="slider-1" id="m1-radio-2">
                <input type="radio" name="slider-1" id="m1-radio-3">


                <div class="cards">
                    <label for="m1-radio-1" class="card">
                        <img src="./images/slider/original-1.webp" alt="foto cocacola original">
                    </label>

                    <label for="m1-radio-2" class="card">
                        <img src="./images/slider/original-2.webp" alt="foto cocacola original">
                    </label>

                    <label for="m1-radio-3" class="card">
                        <img src="./images/slider/original-3.webp" alt="foto cocacola original">
                    </label>
                </div>
            </div>
        </div>
    </section>

    <section class="modal hidden" id="modal2">
        <div class="modal__content">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="modal__content-close icon icon-tabler icons-tabler-outline icon-tabler-x">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M18 6l-12 12" />
                <path d="M6 6l12 12" />
            </svg>

            <div class="modal__content--slider">
                <input type="radio" name="slider-2" id="m2-radio-1" checked>
                <input type="radio" name="slider-2" id="m2-radio-2">
                <input type="radio" name="slider-2" id="m2-radio-3">


                <div class="cards">
                    <label for="m2-radio-1" class="card">
                        <img src="./images/slider/zero-1.webp" alt="foto cocacola zero">
                    </label>

                    <label for="m2-radio-2" class="card">
                        <img src="./images/slider/zero-2.webp" alt="foto cocacola zero">
                    </label>

                    <label for="m2-radio-3" class="card">
                        <img src="./images/slider/zero-3.webp" alt="foto cocacola zero">
                    </label>
                </div>
            </div>
        </div>
    </section>

    <section class="modal hidden" id="modal3">
        <div class="modal__content">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="modal__content-close icon icon-tabler icons-tabler-outline icon-tabler-x">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M18 6l-12 12" />
                <path d="M6 6l12 12" />
            </svg>

            <div class="modal__content--slider">
                <input type="radio" name="slider-3" id="m3-radio-1" checked>
                <input type="radio" name="slider-3" id="m3-radio-2">
                <input type="radio" name="slider-3" id="m3-radio-3">


                <div class="cards">
                    <label for="m3-radio-1" class="card">
                        <img src="./images/slider/light-1.webp" alt="foto cocacola light">
                    </label>

                    <label for="m3-radio-2" class="card">
                        <img src="./images/slider/light-2.webp" alt="foto cocacola light">
                    </label>

                    <label for="m3-radio-3" class="card">
                        <img src="./images/slider/light-3.webp" alt="foto cocacola light">
                    </label>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
